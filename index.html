<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SCAD Online</title>
  <meta name="description" content="View, customize and export OpenSCAD models on iPhone – runs entirely in Safari.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SCAD">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="modulepreload" href="js/app.js">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-tab="model">
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <label for="file-input" class="icon-btn" aria-label="Open .scad file" role="button">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </label>
    <div class="title">
      <span id="file-name">untitled.scad</span>
      <span id="dirty-dot" class="dirty" hidden aria-label="Unsaved changes">●</span>
    </div>
    <button class="primary-btn" id="render-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/></svg>
      <span>Render</span>
    </button>
  </header>

  <main>
    <section id="viewer-pane" class="pane" aria-label="3D view">
      <div id="viewer"></div>
      <div id="status" class="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">Rendering…</span>
        <button id="cancel-btn" class="link-btn">Cancel</button>
      </div>
      <div id="empty-hint" class="empty-hint">
        <p>Tap <strong>Render</strong> to build the model,<br>or <label for="file-input" class="inline-open">open a .scad file</label>.</p>
      </div>
      <div class="view-tools" role="toolbar" aria-label="View">
        <button class="chip" data-view="iso" aria-label="Fit to view">Fit</button>
        <button class="chip" data-view="top">Top</button>
        <button class="chip" data-view="front">Front</button>
        <button class="chip" data-view="right">Right</button>
        <button class="chip" id="edges-btn" aria-pressed="false">Edges</button>
      </div>
      <div id="stats" class="stats" hidden></div>
    </section>

    <section id="side-pane" class="pane">
      <div class="segmented" role="tablist" aria-label="Panels">
        <button role="tab" data-tab="code">Code</button>
        <button role="tab" data-tab="customize">Customize</button>
        <button role="tab" data-tab="console">Console<span class="badge" hidden></span></button>
      </div>

      <div class="panel" id="panel-code" role="tabpanel">
        <div class="keybar" id="keybar" aria-label="Insert symbol"></div>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
                  wrap="off" aria-label="OpenSCAD source"></textarea>
      </div>

      <div class="panel" id="panel-customize" role="tabpanel">
        <div id="params"></div>
        <div class="params-footer">
          <label class="switch-row">
            <span>Render on change</span>
            <input type="checkbox" id="auto-render" checked>
          </label>
          <button class="secondary-btn" id="reset-params">Reset to defaults</button>
        </div>
      </div>

      <div class="panel" id="panel-console" role="tabpanel">
        <pre id="console" aria-live="polite"></pre>
      </div>
    </section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="model">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M12 12l8-4.5 M12 12v9 M12 12L4 7.5"/></svg>
      <span>Model</span>
    </button>
    <button role="tab" data-tab="code">
      <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5 M15 7l5 5-5 5"/></svg>
      <span>Code</span>
    </button>
    <button role="tab" data-tab="customize">
      <svg viewBox="0 0 24 24"><path d="M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>Customize</span>
    </button>
    <button role="tab" data-tab="console">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10l3 2-3 2 M12 15h5"/></svg>
      <span>Console</span><span class="badge" hidden></span>
    </button>
  </nav>

  <dialog id="menu" class="sheet">
    <form method="dialog">
      <div class="sheet-group">
        <button value="new">New file</button>
        <button type="button" id="menu-open">Open .scad file…</button>
        <button value="examples">Examples…</button>
      </div>
      <div class="sheet-group">
        <button value="share-stl" class="needs-model">Share STL…</button>
        <button value="download-stl" class="needs-model">Download STL</button>
        <button value="download-scad">Save .scad file</button>
        <button value="snapshot" class="needs-model">Save snapshot (PNG)</button>
        <button value="link">Copy share link</button>
      </div>
      <div class="sheet-group" id="libs-group" hidden>
        <div class="sheet-note" id="libs-note"></div>
        <button value="clear-libs" class="danger">Remove extra files</button>
      </div>
      <div class="sheet-group">
        <button value="cancel" class="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="examples" class="sheet">
    <form method="dialog">
      <div class="sheet-group" id="examples-list"></div>
      <div class="sheet-group"><button value="" class="cancel">Cancel</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <input type="file" id="file-input" class="visually-hidden" multiple tabindex="-1">

  <script type="module" src="js/app.js"></script>
</body>
</html>
